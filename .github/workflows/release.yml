name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 git lua5.3 liblua5.3-dev pkg-config

      - name: Build apk-tools (v3, for apk packages)
        run: |
          git clone --depth 1 https://gitlab.alpinelinux.org/alpine/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools
          # genhelp 需要 lua5.3，Ubuntu 自带
          make -j"$(nproc)"
          echo "LD_LIBRARY_PATH=/tmp/apk-tools/src" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=/tmp/apk-tools/src /tmp/apk-tools/src/apk --version

      - name: Build ipk packages
        run: |
          python3 tools/build-ipk.py \
            --app-dir luci-app-shadcn-config \
            --theme-dir ref/luci-theme-shadcn \
            --out dist

      - name: Build apk packages
        env:
          APK: /tmp/apk-tools/src/apk
          LD_LIBRARY_PATH: /tmp/apk-tools/src
        run: sh tools/build-apk.sh dist

      - name: Show artifacts
        run: |
          ls -lh dist/*.ipk dist/apk/*.apk

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/apk/*.apk
            tools/install-theme-patch.sh
          fail_on_unmatched_files: false

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 git lua5.3 liblua5.3-dev pkg-config

      - name: Build apk-tools (v3, for apk packages)
        run: |
          git clone --depth 1 https://gitlab.alpinelinux.org/alpine/apk-tools.git /tmp/apk-tools
          cd /tmp/apk-tools
          # genhelp 需要 lua5.3，Ubuntu 自带
          make -j"$(nproc)"
          echo "LD_LIBRARY_PATH=/tmp/apk-tools/src" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH=/tmp/apk-tools/src /tmp/apk-tools/src/apk --version

      - name: Fetch upstream theme and apply the integration
        run: |
          git clone --depth 1 https://github.com/eamonxg/luci-theme-shadcn.git ref/luci-theme-shadcn
          cp -r luci-theme-shadcn-patch/files/. ref/luci-theme-shadcn/
          grep -m1 PKG_RELEASE ref/luci-theme-shadcn/Makefile

      - name: Build po2lmo (for the translation package)
        run: |
          LUCI=https://raw.githubusercontent.com/openwrt/luci/openwrt-25.12/modules/luci-base/src
          mkdir -p /tmp/po2lmo/lib
          cd /tmp/po2lmo
          curl -fsSL -o po2lmo.c "$LUCI/po2lmo.c"
          curl -fsSL -o lib/lmo.c "$LUCI/lib/lmo.c"
          curl -fsSL -o lib/lmo.h "$LUCI/lib/lmo.h"
          curl -fsSL -o plural_formula.y "$LUCI/lib/plural_formula.y"
          curl -fsSL -o lemon.c https://raw.githubusercontent.com/sqlite/sqlite/master/tool/lemon.c
          curl -fsSL -o lempar.c https://raw.githubusercontent.com/sqlite/sqlite/master/tool/lempar.c
          cc -O2 -o lemon lemon.c
          ./lemon plural_formula.y
          cc -O2 -o po2lmo po2lmo.c lib/lmo.c plural_formula.c -I. -Ilib
          echo "PO2LMO=/tmp/po2lmo/po2lmo" >> "$GITHUB_ENV"

      - name: Build ipk packages
        run: |
          python3 tools/build-ipk.py \
            --app-dir luci-app-shadcn-config \
            --theme-dir ref/luci-theme-shadcn \
            --out dist \
            --po2lmo "$PO2LMO"

      - name: Build apk packages
        env:
          APK: /tmp/apk-tools/src/apk
          LD_LIBRARY_PATH: /tmp/apk-tools/src
        run: sh tools/build-apk.sh dist

      - name: Show artifacts
        run: |
          ls -lh dist/*.ipk dist/apk/*.apk

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/apk/*.apk
            tools/install-theme-patch.sh
          fail_on_unmatched_files: false

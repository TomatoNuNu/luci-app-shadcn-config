<style id="shadcn-config">:root{--brand:#ffd700;--primary:#ffd700;--primary-foreground:#000000;--ring:#ffd700;--focus-ring:color-mix(in srgb, #ffd700 50%, transparent);--ring-a50:color-mix(in srgb, #ffd700 50%, transparent);--primary-hover:color-mix(in oklab, #ffd700 86%, #ffffff);--sidebar-active-bg:color-mix(in srgb, #ffd700 12%, transparent);--sidebar-active-fg:color-mix(in oklab, #ffd700 86%, #000000);--progress-bar-end:#ffd700;--progress-bar-start:color-mix(in oklab, #ffd700 60%, #ffffff);--login-path-stroke:#ffd700;--primary-a5:color-mix(in srgb, #ffd700 5%, transparent);--primary-a10:color-mix(in srgb, #ffd700 10%, transparent);--primary-a15:color-mix(in srgb, #ffd700 15%, transparent);--primary-a20:color-mix(in srgb, #ffd700 20%, transparent);--primary-a25:color-mix(in srgb, #ffd700 25%, transparent);--primary-a60:color-mix(in srgb, #ffd700 60%, transparent);--primary-a70:color-mix(in srgb, #ffd700 70%, transparent);--primary-a90:color-mix(in srgb, #ffd700 90%, transparent);}
[data-darkmode="true"]{--brand:#ffd700;--primary:#ffd700;--primary-foreground:#000000;--ring:#ffd700;--focus-ring:color-mix(in srgb, #ffd700 50%, transparent);--ring-a50:color-mix(in srgb, #ffd700 50%, transparent);--primary-hover:color-mix(in oklab, #ffd700 86%, #ffffff);--sidebar-active-bg:color-mix(in srgb, #ffd700 14%, transparent);--sidebar-active-fg:color-mix(in oklab, #ffd700 49%, #ffffff);--progress-bar-end:#ffd700;--progress-bar-start:color-mix(in oklab, #ffd700 60%, #161719);--login-path-stroke:#ffd700;--primary-a5:color-mix(in srgb, #ffd700 5%, transparent);--primary-a10:color-mix(in srgb, #ffd700 10%, transparent);--primary-a15:color-mix(in srgb, #ffd700 15%, transparent);--primary-a20:color-mix(in srgb, #ffd700 20%, transparent);--primary-a25:color-mix(in srgb, #ffd700 25%, transparent);--primary-a60:color-mix(in srgb, #ffd700 60%, transparent);--primary-a70:color-mix(in srgb, #ffd700 70%, transparent);--primary-a90:color-mix(in srgb, #ffd700 90%, transparent);}</style>
</head>
<body class="lang_zh-cn">
<main class="login-layout">
	<section class="login-form-panel">
		<span class="login-logo login-logo--topleft animate-element animate-delay-100">
			<img src="assets/logo.svg" alt="" width="36" height="36">
		</span>
		<div class="login-form-wrap">
			<div class="login-brand animate-element animate-delay-100">
				<span class="login-hostname">OpenWrt</span>
				<span class="login-subtitle">请输入用户名和密码。</span>
			</div>
			<form method="post" class="login-form">
				<div class="login-field animate-element animate-delay-200">
					<label class="login-label" for="luci_username">用户名</label>
					<div class="login-input-glass">
						<span class="login-input-icon"><img src="assets/user.svg" width="16" height="16" alt=""></span>
						<input type="text" name="luci_username" id="luci_username" placeholder="用户名" value="root">
					</div>
				</div>
				<div class="login-field animate-element animate-delay-300">
					<label class="login-label" for="luci_password">密码</label>
					<div class="login-input-glass">
						<span class="login-input-icon"><img src="assets/lock.svg" width="16" height="16" alt=""></span>
						<input type="password" name="luci_password" id="luci_password" placeholder="密码" value="secret">
						<button type="button" class="login-pw-toggle"><img src="assets/eye.svg" width="16" height="16" alt=""></button>
					</div>
				</div>
				<button type="submit" class="login-submit animate-element animate-delay-400">登录</button>
			</form>
		</div>
		<footer class="login-footer">
			<p>preview of luci-theme-shadcn + luci-app-shadcn-config</p>
		</footer>
	</section>
	<section class="login-image-panel" aria-hidden="true">
		<div class="login-image-inner animate-slide-right animate-delay-300"></div>
	</section>
</main>
</body>
</html>

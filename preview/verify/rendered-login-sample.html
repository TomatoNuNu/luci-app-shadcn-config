<!DOCTYPE html>
<html lang="zh-cn" data-shadcn-media="/luci-static/shadcn">
	<head>
		<meta charset="utf-8">
		<meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
		<meta name="theme-color" content="#22d3ee" media="(prefers-color-scheme: dark)">
		<title>OpenWrt</title>
		<script>
			/* Day/night policy -- see luci-app-shadcn-config. mode: auto|light|dark,
			   lock: true disables the per-browser preference entirely. */
			window.SHADCN_THEME_CONFIG = { mode: 'dark', lock: true };
			(function () {
				var cfg = window.SHADCN_THEME_CONFIG;
				var stored = null;
				try { stored = localStorage.getItem('shadcn.theme'); } catch (e) {}
				var theme = stored || 'device';
				if (cfg.lock) {
					/* Server policy wins: ignore the browser preference. */
					theme = (cfg.mode === 'auto') ? 'device' : cfg.mode;
					try { localStorage.setItem('shadcn.theme', theme); } catch (e) {}
					document.documentElement.setAttribute('data-shadcn-mode-lock', 'true');
				}
				else if (!stored && cfg.mode !== 'auto') {
					/* Seed the server default for first time visitors. */
					theme = cfg.mode;
					try { localStorage.setItem('shadcn.theme', theme); } catch (e) {}
				}
				var dark = theme === 'dark' || (theme === 'device' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.setAttribute('data-darkmode', dark ? 'true' : 'false');
				var collapsed = localStorage.getItem('shadcn.sidebar') === 'true';
				document.documentElement.setAttribute('data-sidebar-collapsed', collapsed ? 'true' : 'false');
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<meta name="color-scheme" content="light dark">

[data-shadcn-mode-lock="true"] #theme-toggle-btn { display: none !important; }

<script>
	L = new LuCI({ "media": "\/luci-static\/shadcn", "resource": "\/luci-static\/resources", "scriptname": "", "pathinfo": "", "documentroot": "", "requestpath": [ "admin" ], "dispatchpath": [ "admin" ], "pollinterval": 5, "ubuspath": "\/ubus\/", "sessionid": true, "token": "stub-token", "nodespec": null, "apply_rollback": 90, "apply_holdoff": 4, "apply_timeout": 5, "apply_display": 1.5, "rollback_token": null });

<style>:root{--login-bg-image:url('/luci-static/shadcn/wallpapers/desert-dunes.png')}</style>

<main class="login-layout">

	<!-- Form panel (left) -->
	<section class="login-form-panel">

		<span class="login-logo login-logo--topleft animate-element animate-delay-100">
			<img src="/luci-static/shadcn/images/logo.svg" alt="" width="36" height="36">
		</span>

		<div class="login-form-wrap">
			<div class="login-brand animate-element animate-delay-100">
				<span class="login-hostname">OpenWrt</span>
				<span class="login-subtitle">Please enter your username and password.</span>
			</div>

			<form method="post" class="login-form">

				<div class="login-field animate-element animate-delay-200">
					<label class="login-label" for="luci_username">Username</label>
					<div class="login-input-glass">
						<span class="login-input-icon">
							<img src="/luci-static/shadcn/icons/user.svg" width="16" height="16" alt="">
						</span>
						<input
							type="text"
							name="luci_username"
							id="luci_username"
							placeholder="Username"
							autocomplete="username"
value="root"						>
					</div>
				</div>

				<div class="login-field animate-element animate-delay-300">
					<label class="login-label" for="luci_password">Password</label>
					<div class="login-input-glass">
						<span class="login-input-icon">
							<img src="/luci-static/shadcn/icons/lock.svg" width="16" height="16" alt="">
						</span>
						<input
							type="password"
							name="luci_password"
							id="luci_password"
							placeholder="Password"
							autocomplete="current-password"
							autofocus
						>
						<button type="button" class="login-pw-toggle" id="pw-toggle" aria-label="Reveal/hide password">
							<img src="/luci-static/shadcn/icons/eye.svg" id="pw-toggle-icon" width="16" height="16" alt="">
						</button>
					</div>
				</div>

				<input type="hidden" name="luci_magic" value="stub-token">

				<button type="submit" class="login-submit animate-element animate-delay-400">
					Log in
				</button>
			</form>
		</div>

		<footer class="login-footer">
			<p>© <a href="https://github.com/eamonxg/luci-theme-shadcn/graphs/contributors?all=1" target="_blank" rel="noreferrer">luci-theme-shadcn</a> · Powered by <a href="https://openwrt.org" target="_blank" rel="noreferrer">OpenWrt</a> &amp; <a href="https://github.com/openwrt/luci" target="_blank" rel="noreferrer">LuCI</a> &amp; <a href="https://github.com/shadcn-ui/ui" target="_blank" rel="noreferrer">shadcn</a> &amp; <a href="https://github.com/lucide-icons/lucide" target="_blank" rel="noreferrer">Lucide</a></p>
		</footer>
	</section>

	<!-- Image panel (right) -->
	<section class="login-image-panel" aria-hidden="true">
		<div class="login-image-inner animate-slide-right animate-delay-300"></div>

	</section>

</main>

<script>
(function () {
	var btn = document.getElementById('pw-toggle');
	var inp = document.getElementById('luci_password');
	var ico = document.getElementById('pw-toggle-icon');
	if (!btn || !inp || !ico) return;
	var base = (document.documentElement.getAttribute('data-shadcn-media') || '/luci-static/shadcn').replace(/\/$/, '');
	btn.addEventListener('click', function () {
		var show = inp.type === 'password';
		inp.type = show ? 'text' : 'password';
		ico.src = base + (show ? '/icons/eye-off.svg' : '/icons/eye.svg');
	});
})();
</script>
